# frontend is an Argo Rollout (canary) instead of a Deployment.
# Traffic split is done by Traefik: Argo Rollouts rewrites the weights in
# TraefikService "frontend-split" (see frontend-traffic.yaml) at each step.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
  labels: { app: frontend }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: frontend }
  strategy:
    canary:
      stableService: frontend-stable
      canaryService: frontend-canary
      trafficRouting:
        traefik:
          weightedTraefikServiceName: frontend-split
      steps:
        - setWeight: 10
        - pause: {}                 # wait for manual Promote
        - setWeight: 50
        - pause: { duration: 30s }
        # then 100% automatically
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: shop-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
# Argo Rollouts adds a pod-template-hash selector to each service at runtime
apiVersion: v1
kind: Service
metadata:
  name: frontend-stable
  labels: { app: frontend }
spec:
  selector: { app: frontend }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-canary
  labels: { app: frontend }
spec:
  selector: { app: frontend }
  ports:
    - port: 8080
      targetPort: 8080
