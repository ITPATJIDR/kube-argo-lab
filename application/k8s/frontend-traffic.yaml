# Weighted split between stable and canary. Argo Rollouts owns the weights;
# Argo CD is told to ignore them (ignoreDifferences in cicd/argocd/shop-app.yaml).
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: frontend-split
spec:
  weighted:
    services:
      - name: frontend-stable
        port: 8080
        weight: 100
      - name: frontend-canary
        port: 8080
        weight: 0
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend
spec:
  entryPoints: [web]
  routes:
    - match: Host(`shop.localhost`)
      kind: Rule
      services:
        - name: frontend-split
          kind: TraefikService
