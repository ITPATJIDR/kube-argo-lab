# Serves the SPA and reverse-proxies /api/* to the backend services.
# Upstream hosts are overridable via env (envsubst at container start).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    location /api/auth/     { proxy_pass http://${AUTH_HOST}; }
    location /api/products  { proxy_pass http://${PRODUCTS_HOST}; }
    location /api/search    { proxy_pass http://${SEARCH_HOST}; }

    location / { try_files $uri /index.html; }
}
