<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gosoft Lab Shop</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7280; --accent:#2563eb; --border:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
           padding:16px; background:var(--card); border-bottom:1px solid var(--border); }
  h1 { font-size:20px; margin:0; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  input, button { font:inherit; padding:8px 12px; border:1px solid var(--border); border-radius:8px; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  #search { display:flex; gap:8px; margin-bottom:16px; }
  #search input { flex:1; min-width:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; }
  .card h3 { margin:0 0 4px; font-size:16px; }
  .cat { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .price { font-weight:600; margin-top:8px; }
  .desc { color:var(--muted); font-size:14px; }
  #status { color:var(--muted); margin-bottom:12px; font-size:14px; }
  .err { color:#b91c1c; }
</style>
</head>
<body>
<header>
  <h1>Gosoft Lab Shop</h1>
  <div id="auth"></div>
</header>
<main>
  <form id="search">
    <input id="q" placeholder="ค้นหาสินค้า เช่น keyboard, storage" autocomplete="off">
    <button>ค้นหา</button>
    <button type="button" class="secondary" id="all">ทั้งหมด</button>
  </form>
  <div id="status"></div>
  <div class="grid" id="list"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const fmt = new Intl.NumberFormat("th-TH", { style: "currency", currency: "THB", maximumFractionDigits: 0 });
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
function load(k) { try { return localStorage.getItem(k); } catch { return null; } }

function render(items, label) {
  $("#status").textContent = `${label} — ${items.length} รายการ`;
  $("#list").innerHTML = items.map((p) => `
    <div class="card">
      <div class="cat">${esc(p.category)}</div>
      <h3>${esc(p.name)}</h3>
      <div class="desc">${esc(p.description)}</div>
      <div class="price">${fmt.format(p.price)}</div>
    </div>`).join("");
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || body.detail || r.statusText);
  return body;
}

async function loadAll() {
  try { const d = await api("/api/products"); render(d.items, "สินค้าทั้งหมด (products · Ruby)"); }
  catch (e) { $("#status").innerHTML = `<span class="err">products: ${esc(e.message)}</span>`; }
}

$("#search").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = $("#q").value.trim();
  try { const d = await api(`/api/search?q=${encodeURIComponent(q)}`); render(d.items, `ผลค้นหา "${q}" (search · Python)`); }
  catch (e) { $("#status").innerHTML = `<span class="err">search: ${esc(e.message)}</span>`; }
});
$("#all").addEventListener("click", () => { $("#q").value = ""; loadAll(); });

async function renderAuth() {
  const token = load("token");
  if (token) {
    try {
      const d = await api("/api/auth/verify", { headers: { Authorization: `Bearer ${token}` } });
      $("#auth").innerHTML = `<span>สวัสดี <b>${esc(d.username)}</b> </span> <button class="secondary" id="logout">ออกจากระบบ</button>`;
      $("#logout").onclick = () => { store("token", null); renderAuth(); };
      return;
    } catch { store("token", null); }
  }
  $("#auth").innerHTML = `
    <form id="login">
      <input name="username" placeholder="username (alice)" size="12" required>
      <input name="password" type="password" placeholder="password" size="12" required>
      <button>เข้าสู่ระบบ</button>
    </form>`;
  $("#login").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      const d = await api("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: f.get("username"), password: f.get("password") }) });
      store("token", d.token); renderAuth();
    } catch (err) { $("#status").innerHTML = `<span class="err">auth: ${esc(err.message)}</span>`; }
  };
}

renderAuth();
loadAll();
</script>
</body>
</html>
