apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: REPO_URL          # replaced by setup.sh
    targetRevision: main
    path: application/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  # Argo Rollouts changes these weights during a canary — don't treat that as drift
  ignoreDifferences:
    - group: traefik.io
      kind: TraefikService
      name: frontend-split
      jqPathExpressions:
        - .spec.weighted.services[].weight
